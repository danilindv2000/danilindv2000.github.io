<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прохождение теста - КвантиУм</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="container">
                <div class="logo">
                    <h2>🎓 КвантиУм</h2>
                </div>
                <nav class="dashboard-nav">
                    <a href="dashboard.html">Главная</a>
                    <a href="tests.html">Тесты</a>
                    <a href="results.html">Результаты</a>
                    <a href="groups.html">Группы</a>
                    <a href="#" onclick="logout()">Выйти</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="dashboard-content">
            <div class="container">
                <!-- Test Header with Timer -->
                <div class="section">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
                        <div>
                            <h2 id="testTitle">Загрузка теста...</h2>
                            <p id="testInfo" style="color: var(--text-light); margin-top: 0.5rem;"></p>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 1.2rem; font-weight: bold; color: var(--primary-color);">
                                ⏱️ <span id="timer">30:00</span>
                            </div>
                            <div style="color: var(--text-light); font-size: 0.9rem;">Осталось времени</div>
                        </div>
                    </div>
                    
                    <!-- Current Question -->
                    <div id="currentQuestion" class="test-item" style="padding: 2rem;">
                        <div class="test-info">
                            <h3 id="questionNumber">Вопрос 1 из 10</h3>
                            <div id="questionText" style="margin-top: 1rem; font-size: 1.2rem; line-height: 1.6;"></div>
                        </div>
                        
                        <!-- Options -->
                        <div id="optionsContainer" style="margin-top: 2rem;">
                            <!-- Options will be loaded here -->
                        </div>
                    </div>
                    
                    <!-- Navigation -->
                    <div style="display: flex; justify-content: space-between; margin-top: 2rem;">
                        <button id="prevBtn" class="btn-secondary" onclick="prevQuestion()" disabled>Назад</button>
                        <button id="nextBtn" class="btn-primary" onclick="nextQuestion()">Далее</button>
                        <button id="finishBtn" class="btn-primary" onclick="finishTest()" style="display: none;">Завершить тест</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/test-taking.js"></script>
</body>
</html>
